steps:
  - label: ":sparkles: Tests"
    plugins:
      - plugin-tester#v1.3.0: ~

  - label: ":lint-roller: Lint"
    plugins:
      - plugin-linter#v3.3.0:
          id: setup-go

  - label: ":golang: Smoke test"
    command:
      - "command -v go"
      - "go version"
      - "go env -json GOVERSION GOROOT GOPATH GOMODCACHE GOCACHE GOBIN"
      - '"$MISE_DATA_DIR/bin/mise" exec -- shellcheck --version'
      - '"$MISE_DATA_DIR/bin/mise" exec -- shellcheck hooks/pre-command tests/pre-command.bats'
    plugins:
      - mise#v1.1.0: ~
      - ./: ~

  - label: ":shell: Shellcheck"
    command: '"$MISE_DATA_DIR/bin/mise" exec -- shellcheck hooks/* tests/pre-command.bats'
    plugins:
      - mise#v1.1.0: ~
