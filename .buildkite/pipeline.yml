steps:
  - label: ":sparkles: Tests"
    plugins:
      - plugin-tester#v1.3.0: ~

  - label: ":lint-roller: Lint"
    plugins:
      - plugin-linter#v3.3.0:
          id: setup-go

  - label: ":golang: Smoke test"
    command:
      - 'export PATH="$${MISE_DATA_DIR:-$${HOME}/.local/share/mise}/bin:$${PATH}"'
      - "command -v go"
      - "go version"
      - "go env -json GOVERSION GOROOT GOPATH GOMODCACHE GOCACHE GOBIN"
      - "mise exec -- shellcheck --version"
      - "mise exec -- shellcheck hooks/pre-command tests/pre-command.bats"
    plugins:
      - mise#v1.1.5: ~
      - ./: ~

  - label: ":shell: Shellcheck"
    command:
      - 'export PATH="$${MISE_DATA_DIR:-$${HOME}/.local/share/mise}/bin:$${PATH}"'
      - "mise exec -- shellcheck hooks/* tests/pre-command.bats"
    plugins:
      - mise#v1.1.5: ~
